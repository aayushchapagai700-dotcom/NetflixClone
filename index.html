<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="box">
      <nav class="heading">
        <img src="./Assets/netflix.svg" alt="Netflix logo" />
        
        <button>Sign In</button>
      </nav>
      <section class="front">
        
        <h1>So much to watch, matched to you</h1>
        <h3>Starts at USD 2.99. Cancel anytime.</h3>
        <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
        <div class="sign">
          <input type="email" class="Email" required placeholder="Email address">
          <button class="but">Get Started  ></button>
        </div>
      </section>

    </main>
   <section class="down">
     <div class="first">
      <span>Trending Now</span>
      <figure class="picture">
        <div class="pic"><img src="Assets/1.webp" alt=""></div>
        <div class="pic"><img src="Assets/2.webp" alt=""></div>
        <div class="pic"><img src="Assets/3.webp" alt=""></div>
        <div class="pic"><img src="Assets/4.webp" alt=""></div>
        <div class="pic"><img src="Assets/5.webp" alt=""></div>
      </figure>

      
     </div>
     <div>More Reason to join</div>
     <div></div>
  </section>
</body>
</html>
